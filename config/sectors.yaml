# Broad-sector mapping for industry deflators and capital consumption.
#
# Price indexes are FRED series from BEA's GDP-by-Industry release, index
# 2017=100. `industries` are BEA summary Use-table industry codes.
#
# CFC groups are deliberately coarser than the IO industries because the BEA
# NIPA capital-consumption tables publish corporate detail but only broad
# noncorporate detail. CFC is allocated within each group in proportion to
# gross operating surplus.

deflators:
  agriculture:
    label: Agriculture, forestry, fishing, and hunting
    va_price: VAPIAFH
    go_price: GOPIAFH
    industries: [111CA, 113FF]

  mining:
    label: Mining
    va_price: VAPIM
    go_price: GOPIM
    industries: [211, 212, 213]

  utilities:
    label: Utilities
    va_price: VAPIU
    go_price: GOPIU
    industries: [22]

  construction:
    label: Construction
    va_price: VAPIC
    go_price: GOPIC
    industries: [23]

  manufacturing:
    label: Manufacturing
    va_price: VAPIMA
    go_price: GOPIMA
    industries:
      - "321"
      - "327"
      - "331"
      - "332"
      - "333"
      - "334"
      - "335"
