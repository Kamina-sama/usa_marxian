# Mapping from BEA detailed fixed-asset industries to BEA IO summary industries.
#
# Source: BEA Fixed Assets, "Net Stock of Private Nonresidential Fixed Assets",
# detail file detailnonres_stk1.xlsx (current-cost net stock, millions of USD).
#
# The detailed file has 74 private nonresidential industries; the IO summary
# table has 71 industries, including government and housing. Government units
# and housing have no private nonresidential fixed assets in this file, so they
# fall back to the cost proxy and are flagged in capital_source.

source_url: "https://apps.bea.gov/national/FA2004/Details/xls/detailnonres_stk1.xlsx"

# Fallback for IO industries without a fixed-asset counterpart:
#   cost = K_i (the previous proxy)
fallback: cost

