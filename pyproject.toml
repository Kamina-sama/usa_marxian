[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usa-marxian"
version = "0.19.0"
description = "Empirical framework for Moseley's macro-monetary interpretation of Marx's theory, applied to US data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "usa_marxian contributors" }]
keywords = ["marxian economics", "moseley", "melt", "surplus value", "usa", "nipa"]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "linearmodels>=7.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Optional official client libraries, only needed if you want to use API keys
# instead of the keyless downloaders that ship with this project.
api = [
    "fredapi>=0.5",
    "beaapi>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[project.scripts]
usa-marxian = "usa_marxian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that hit live data providers (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["usa_marxian"]
